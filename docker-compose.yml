services:
  db:
    image: pgvector/pgvector:pg16
    container_name: uptowes_db
    environment:
      POSTGRES_USER: uptowes
      POSTGRES_PASSWORD: uptowes
      POSTGRES_DB: uptowes
    ports:
      - "5432:5432"
    volumes:
      - uptowes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptowes -d uptowes"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  uptowes_pgdata:
